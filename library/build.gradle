apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'com.jaredrummler.cyanea'
  compileSdkVersion buildConfig.compileSdk

  defaultConfig {
    minSdkVersion buildConfig.minSdk
    targetSdkVersion buildConfig.targetSdk
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main.res.srcDirs 'res', 'res-public'
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation deps.kotlin.stdlib.jdk
  implementation deps.androidx.appCompat
  implementation deps.androidx.preferences
  implementation deps.material
  implementation deps.colorpicker
  testImplementation deps.junit
  testImplementation deps.mockito.core
  testImplementation deps.mockito.kotlin
}

// gradle-mvn-push.gradle uses the Gradle 6 'maven' plugin which was removed in
// Gradle 7. Re-enabling Maven Central publishing requires porting it to
// 'maven-publish'. Skipped here so the local build can proceed.
